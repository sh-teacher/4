<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부위별 스트레칭 가이드</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --text: #1c2230;
    --text-dim: #5b6472;
    --accent: #2f7d5f;
    --accent-soft: #e4f3ec;
    --border: #e3e7ec;
    --danger: #b5502f;
    --danger-soft: #fbeee6;
    --shadow: 0 1px 3px rgba(20, 30, 40, 0.08), 0 1px 2px rgba(20, 30, 40, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --card-bg: #1d232b;
      --text: #eef1f4;
      --text-dim: #98a3ae;
      --accent: #59c290;
      --accent-soft: #1d3229;
      --border: #2a3138;
      --danger: #e08a63;
      --danger-soft: #33221b;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 18px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.92rem;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }
  .part-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .part-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text);
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .part-btn:hover { transform: translateY(-2px); }
  .part-btn .emoji { font-size: 1.6rem; }
  .part-btn.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  #result-section { display: none; }
  #result-section.visible { display: block; }
  .result-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .result-title .emoji { font-size: 1.4rem; }
  .result-title h2 { margin: 0; font-size: 1.25rem; }
  .result-desc {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0 0 18px;
  }
  .stretch-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .stretch-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .stretch-head h3 {
    margin: 0;
    font-size: 1.05rem;
  }
  .badge {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .steps {
    margin: 0 0 10px;
    padding-left: 20px;
    font-size: 0.92rem;
  }
  .steps li { margin-bottom: 4px; }
  .caution {
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .timer-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .timer-btn {
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  .timer-btn:disabled { opacity: 0.6; cursor: default; }
  .timer-display {
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    color: var(--text-dim);
    min-width: 70px;
  }
  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.92rem;
    padding: 40px 20px;
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    padding: 10px 20px 30px;
  }
</style>
</head>
<body>

<header>
  <h1>🧘 부위별 스트레칭 가이드</h1>
  <p>아픈 부위를 선택하면 도움이 되는 스트레칭 방법을 알려드려요</p>
</header>

<main>
  <div class="part-grid" id="part-grid"></div>

  <section id="result-section">
    <div class="result-title">
      <span class="emoji" id="result-emoji"></span>
      <h2 id="result-name"></h2>
    </div>
    <p class="result-desc" id="result-desc"></p>
    <div id="stretch-list"></div>
  </section>

  <div class="empty-hint" id="empty-hint">위에서 아픈 부위를 눌러보세요</div>
</main>

<footer>본 정보는 일반적인 스트레칭 안내이며, 통증이 심하거나 지속되면 전문의와 상담하세요.</footer>

          "반시계 방향으로도 10회 돌린 뒤 반대쪽 발도 실시한다."
        ],
        caution: "통증이 없는 범위 내에서 천천히 돌리세요."
      },
      {
        name: "앉아서 발목 당기기",
        badge: "좌우 각 15초",
        seconds: 15,
        steps: [
          "바닥에 앉아 다리를 곧게 편다.",
          "발끝을 몸 쪽으로 당겨 종아리와 발목 뒤쪽이 늘어나는 느낌을 15초 유지한다.",
          "발끝을 반대로 밀어 발등 쪽도 15초 스트레칭한다.",
          "반대쪽 발도 동일하게 실시한다."

        caution: "무릎을 굽히지 않고 곧게 편 상태를 유지하세요."

  }
};

const grid = document.getElementById('part-grid');
const resultSection = document.getElementById('result-section');
const emptyHint = document.getElementById('empty-hint');
const resultEmoji = document.getElementById('result-emoji');
const resultName = document.getElementById('result-name');
const resultDesc = document.getElementById('result-desc');
const stretchList = document.getElementById('stretch-list');

Object.entries(DATA).forEach(([key, part]) => {
  const btn = document.createElement('button');
  btn.className = 'part-btn';
  btn.dataset.key = key;
  btn.innerHTML = `<span class="emoji">${part.emoji}</span><span>${part.label}</span>`;
  btn.addEventListener('click', () => selectPart(key));
  grid.appendChild(btn);
});

function selectPart(key) {
  document.querySelectorAll('.part-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });

  const part = DATA[key];
  resultEmoji.textContent = part.emoji;
  resultName.textContent = `${part.label} 스트레칭`;
  resultDesc.textContent = part.desc;

  stretchList.innerHTML = '';
  part.stretches.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'stretch-card';

    const stepsHtml = s.steps.map(st => `<li>${st}</li>`).join('');

    card.innerHTML = `
      <div class="stretch-head">
        <h3>${idx + 1}. ${s.name}</h3>
        <span class="badge">${s.badge}</span>
      </div>
      <ol class="steps">${stepsHtml}</ol>
      <div class="caution">⚠️ ${s.caution}</div>
      <div class="timer-row">
        <button class="timer-btn" data-seconds="${s.seconds}">${s.seconds}초 타이머 시작</button>
        <span class="timer-display"></span>
      </div>
    `;

    const timerBtn = card.querySelector('.timer-btn');
    const timerDisplay = card.querySelector('.timer-display');
    timerBtn.addEventListener('click', () => runTimer(timerBtn, timerDisplay, s.seconds));

    stretchList.appendChild(card);
  });

  resultSection.classList.add('visible');
  emptyHint.style.display = 'none';
}

function runTimer(btn, display, totalSeconds) {
  let remaining = totalSeconds;
  btn.disabled = true;
  const originalText = `${totalSeconds}초 타이머 시작`;
  display.textContent = `남은 시간: ${remaining}초`;

  const interval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(interval);
      display.textContent = '완료! 👍';
      btn.disabled = false;
      btn.textContent = originalText;
      setTimeout(() => { display.textContent = ''; }, 2500);
    } else {
      display.textContent = `남은 시간: ${remaining}초`;
    }
  }, 1000);
}
</script>
